name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported Node.js line (package.json requires >=22.12). The tests
        # run on Node, not bun: Node is what apps build and server-render with.
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: bun install --frozen-lockfile
      # React 18.3 for the react-18 test project.
      - run: bun run install:react-18
      - run: bun run typecheck
      - run: bun run build
      # Every test on React 19, and the rendering tests again on React 18.3.
      - run: bun run test:coverage
      # The published package's exports and types, in every resolution mode.
      - run: bun run check:package
